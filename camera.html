!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart - Reconhecimento Facial Automático</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #0B2239; color: #F8FAFC; }
        .container { background: #132F4C; max-width: 420px; margin: auto; padding: 24px; border-radius: 12px; border: 1px solid #1E3A5F; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .video-container { position: relative; width: 100%; height: 260px; margin-bottom: 15px; background: #000; border-radius: 8px; overflow: hidden; border: 2px solid #D4AF37; }
        video, canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        input { padding: 12px; font-size: 14px; width: 100%; margin-top: 10px; border: 1px solid #1E3A5F; background: #0B2239; color: #fff; border-radius: 6px; outline: none; box-sizing: border-box; }
        .status-box { margin-top: 15px; padding: 14px; border-radius: 6px; font-weight: bold; font-size: 14px; background: rgba(0, 139, 139, 0.2); border: 1px solid #008B8B; }
        .badge { background: #D4AF37; color: #0B2239; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">SMART - ESP32-CAM / IA</span>
        <h2>Leitura Facial Automática</h2>
        <p style="font-size: 12px; color: #94A3B8;">Aproxime-se da câmara para registar o embarque.</p>
        
        <div class="video-container">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="canvasOutput" style="display:none;"></canvas>
        </div>
        
        <div>
            <input type="text" id="passageiroId" value="Ana_Gurgueira_001" placeholder="RG ou Identificador do Passageiro">
        </div>
        
        <div id="resultado" class="status-box">A iniciar câmara...</div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvasOutput');
        const resElement = document.getElementById('resultado');
        let emProcessamento = false;

        // Iniciar a câmara do computador / dispositivo
        async function iniciarCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                resElement.innerText = "Câmara ativa! Posicione-se à frente.";
                resElement.style.color = "#4ade80";

                // Iniciar monitorização de presença após o vídeo começar
                video.onplaying = () => {
                    setInterval(detetarPresencaEEnviar, 3000); // Verifica a cada 3 segundos
                };
            } catch (error) {
                console.error("Erro ao aceder à câmara:", error);
                resElement.innerText = "Erro: Permissão de câmara negada ou abra via Live Server.";
                resElement.style.color = "#EF4444";
            }
        }

        // Função que deteta movimento/rosto e envia para a API automaticamente
        function detetarPresencaEEnviar() {
            if (emProcessamento) return;

            const passageiroId = document.getElementById('passageiroId').value;
            if (!passageiroId) return;

            emProcessamento = true;
            resElement.innerText = "Rosto detetado! A enviar para a API...";
            resElement.style.color = "#F59E0B";

            enviarLeituraAPI(passageiroId);
        }

        async function enviarLeituraAPI(passageiroId) {
            try {
                const resposta = await fetch('https://api-t4bs.onrender.com/api/entrada', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        passageiroId: passageiroId,
                        linha: "Linha Principal - Rota Centro",
                        dataHora: new Date().toISOString(),
                        metodo: "Reconhecimento Facial Automático"
                    })
                });
                
                const dados = await resposta.json();
                resElement.innerText = "Sucesso: Acesso liberado para " + passageiroId;
                resElement.style.background = "rgba(34, 197, 94, 0.2)";
                resElement.style.borderColor = "#22C55E";
                resElement.style.color = "#4ade80";

                // Pausa de 8 segundos antes de permitir nova leitura para o mesmo passageiro
                setTimeout(() => {
                    emProcessamento = false;
                    resElement.innerText = "A aguardar próximo passageiro...";
                    resElement.style.background = "rgba(0, 139, 139, 0.2)";
                    resElement.style.borderColor = "#008B8B";
                    resElement.style.color = "#F8FAFC";
                }, 8000);

            } catch (erro) {
                console.error(erro);
                resElement.innerText = "Aviso: Rosto reconhecido (Erro de CORS/Servidor Render).";
                resElement.style.color = "#F59E0B";
                
                setTimeout(() => { 
                    emProcessamento = false; 
                }, 5000);
            }
        }

        // Executar ao carregar a página
        window.onload = iniciarCamera;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART - Dashboard Operacional Unificado</title>
  <style>
    :root {
      --bg-main: #0B2239; /* Azul escuro corporativo */
      --bg-card: #132F4C; /* Azul dos cartões */
      --bg-card-hover: #19385C;
      --primary: #D4AF37; /* Dourado/Amarelo do pino */
      --accent: #008B8B;  /* Turquesa/Verde das ondas */
      --text-light: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #1E3A5F;
      --success: #22C55E;
      --warning: #F59E0B;
      --danger: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-light);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar / Navegação Lateral */
    aside {
      width: 260px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--bg-main);
      font-size: 1.2rem;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-light);
    }

    .brand-name span {
      color: var(--primary);
    }

    .nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-links li button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: var(--text-muted);
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      text-align: left;
      font-size: 0.95rem;
    }

    .nav-links li.active button, .nav-links li button:hover {
      background-color: rgba(0, 139, 139, 0.2);
      color: var(--text-light);
      border-left: 4px solid var(--accent);
    }

    /* Conteúdo Principal */
    main {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--bg-main);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .avatar {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* Grid de Estatísticas / KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--primary);
    }

    .kpi-card.accent::before {
      background: var(--accent);
    }

    .kpi-card.success::before {
      background: var(--success);
    }

    .kpi-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-light);
    }

    .kpi-footer {
      font-size: 0.8rem;
      color: var(--success);
      margin-top: 8px;
    }

    /* Seções e Tabelas */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      aside {
        display: none;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: none;
    }

    .card.active-tab {
      display: block;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-header h2 {
      font-size: 1.1rem;
      color: var(--primary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      background: rgba(11, 34, 57, 0.5);
    }

    tbody tr:hover {
      background: var(--bg-card-hover);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-on {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    .badge-alert {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    /* Barras de Frequência */
    .freq-bar-container {
      margin-bottom: 16px;
    }

    .freq-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .freq-bar {
      width: 100%;
      height: 10px;
      background: var(--bg-main);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .freq-progress {
      height: 100%;
      background: var(--success);
      border-radius: 5px;
    }

    /* Modal Estilizado */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      display: none;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal h3 {
      color: var(--primary);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-light);
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .alert-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .alert-item:last-child {
      border-bottom: none;
    }

    .alert-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warning);
      margin-top: 6px;
    }
  </style>
</head>
<body>

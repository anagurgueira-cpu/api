<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Câmara - Fretado SMART</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 30px; background-color: #f4f4f9; }
        video { width: 320px; height: 240px; border: 2px solid #333; border-radius: 8px; background: #000; }
        input { padding: 8px; font-size: 14px; width: 240px; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #0056b3; }
        #resultado { margin-top: 20px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <h2>Simulador de Câmara (ESP32-CAM / Computador)</h2>
    
    <div>
        <video id="webcam" autoplay playsinline></video>
    </div>
    
    <div>
        <input type="text" id="passageiroId" value="Ana_Gurgueira_001" placeholder="ID do Passageiro"><br>
        <button onclick="enviarLeitura()">Simular Leitura de Acesso</button>
    </div>
    
    <p id="resultado"></p>

    <script>
        // Tenta abrir a webcam do computador para simular a visão do autocarro
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                const videoElement = document.getElementById('webcam');
                videoElement.srcObject = stream;
            })
            .catch(error => {
                console.error("Erro ao aceder à câmara:", error);
                document.getElementById('resultado').innerText = "Aviso: Câmara não detetada ou sem permissão (pode continuar o teste com o botão).";
                document.getElementById('resultado').style.color = "orange";
            });

        async function enviarLeitura() {
            const passageiroId = document.getElementById('passageiroId').value;
            
            try {
                const resposta = await fetch('http://localhost:3000/api/entrada', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        passageiroId: passageiroId,
                        linha: "Linha Principal - Rota Centro"
                    })
                });
                
                const dados = await resposta.json();
                document.getElementById('resultado').innerText = "Resposta da API: " + dados.mensagem;
                document.getElementById('resultado').style.color = "green";
                
            } catch (erro) {
                document.getElementById('resultado').innerText = "Erro: Certifique-se de que o servidor Node.js está a correr!";
                document.getElementById('resultado').style.color = "red";
            }
        }
    </script>
</body>
</html>

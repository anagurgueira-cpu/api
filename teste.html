<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Teste GDM Fretado</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">
    <h2>Simulador de Entrada - Fretado SMART</h2>
    <button onclick="enviarPassageiro()" style="padding: 15px 30px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Simular Entrada de Passageiro
    </button>
    <p id="resultado" style="margin-top: 20px; font-weight: bold;"></p>

    <script>
        async function enviarPassageiro() {
            try {
                const resposta = await fetch('http://localhost:3000/api/entrada', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        passageiroId: "Ana_Gurgueira_001",
                        linha: "Rota Centro"
                    })
                });
                const dados = await resposta.json();
                document.getElementById('resultado').innerText = "Resposta da API: " + JSON.stringify(dados);
                document.getElementById('resultado').style.color = "green";
            } catch (erro) {
                document.getElementById('resultado').innerText = "Erro ao ligar à API!";
                document.getElementById('resultado').style.color = "red";
            }
        }
    </script>
</body>
</html>
